name: 24/7 Website Uptime Monitor Ping

on:
  schedule:
    # Run every 5 minutes (GitHub Actions cron limit)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Monitor Check Endpoint
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$VERCEL_APP_URL" ]; then
            echo "Pinging $VERCEL_APP_URL/api/check..."
            curl -s -f "$VERCEL_APP_URL/api/check?cron=true&key=$CRON_SECRET" || echo "Ping failed or returned error"
          else
            echo "VERCEL_APP_URL secret is not set yet. Skipping."
          fi
